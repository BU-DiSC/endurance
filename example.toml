# -----------------------------------------------------------------------------
# AXE configuration file
#   Holds all of the configuration options, defaults are found in axe/config.py
# -----------------------------------------------------------------------------
use_gpu = false
disable_tqdm = false
seed = 0
log_level = "INFO"

[lsm]
# Policy will effect everything else down stream (e.g. choice of neural network
# architecture for learned cost model)
#   Tiering
#   Leveling
#   Classic - Considers both leveing and tiering
#   QHybrid - Levels 1 -> L = Q
#   Fluid - Levels 1 -> (L-1) = Q, Level L = Z
#   Kapacity - Each level has own K_i decision
policy = "Kapacity"

# Bounds will describe the search space of potential values
[lsm.bounds]
max_considered_levels = 20                  # Max number of levels to consider
size_ratio_range = [2, 22]                  # low, high of size ratio range
page_sizes = [4, 8, 16]                     # page size in KB
entry_sizes = [1024, 2048, 4096, 8192]      # avg. size of each entry bits
memory_budget_range = [5, 20]               # low, high, bits per element
selectivity_range = [1e-7, 1e-9]            # low, high
elements_range = [100000000, 2000000000]    # element range

# Learned cost model hyper parameters
[lcm]
embedding_size = 8
hidden_length = 3
hidden_width = 64
decision_dim = 64
dropout = 0.0           # dropout percentage
norm_layer = "Batch"    # "Batch" or "Layer" norm
policy_embedding_size = 4  # Used only for classic models; generally < embedding_size

# Learned tuner hyper parameters
[ltuner]
penalty_factor = 10
hidden_length = 4
hidden_width = 64
dropout = 0.1                  # dropout percentage
norm_layer = "Batch"           # batch or layer norm
categorical_mode = "gumbel"    # reinmax or gumbel

[ltuner.train_kwargs]
temp = 10
hard = false

[ltuner.validate_kwargs]
temp = 0.001
hard = true

# --------------------------------------
[lcm_train]
#   training parameters for the learned cost model
# --------------------------------------
max_epochs = 10
data_split = 0.9
batch_size = 64
shuffle = false
num_workers = 1
checkpoints = true

# Optimizer choice for training, refer to pytorch docs for options
[lcm_train.optimizer]
name = "Adam"
options = {"lr" = 0.001}

# scheduler choice for training, refer to pytorch docs for options
[lcm_train.scheduler]
name = "CosineAnnealingLR"
options = {"T_max" = 10, "eta_min" = 0.0001}

# loss choice for training, the name can be a path to a neural network
[lcm_train.loss]
name = "MSE"
options = {"reduction" = "mean"}

# --------------------------------------
[ltuner_train]
#   training parameters for the learned tuner
# --------------------------------------
max_epochs = 100
data_split = 0.9
batch_size = 1024
shuffle = true
num_workers = 2
checkpoints = true

# Optimizer choice for training, refer to pytorch docs for options
[ltuner_train.optimizer]
name = "AdamW"
options = {"lr" = 0.001}

# scheduler choice for training, refer to pytorch docs for options
[ltuner_train.scheduler]
name = "CosineAnnealingLR"
options = {"T_max" = 10, "eta_min" = 0.0001}

# loss choice for training, the name can be a path to a neural network
# [ltuner_train.loss]
# name = "MSE"
# loss_fn_path = "data/lcm/models/kaplsm_250523_1406"
# options = {"reduction" = "mean"}
