# ==

# Bounds will describe the search space of potential values
[lsm.bounds]
max_considered_levels = 20                  # Max number of levels to consider
size_ratio_range = [2, 22]                  # low, high of size ratio range
page_sizes = [4, 8, 16]                     # page size in KB
entry_sizes = [1024, 2048, 4096, 8192]      # avg. size of each entry bits
memory_budget_range = [5, 20]               # low, high, bits per element
selectivity_range = [1e-7, 1e-9]            # low, high
elements_range = [100000000, 2000000000]    # element range

# Learned cost model hyper parameters
[lcm]
embedding_size = 8
hidden_length = 3
hidden_width = 64
decision_dim = 64
dropout = 0.0           # dropout percentage
norm_layer = "Batch"    # "Batch" or "Layer" norm
policy_embedding_size = 4  # Used only for classic models; generally < embedding_size

# Learned tuner hyper parameters
[ltuner]
penalty_factor = 10
hidden_length = 4
hidden_width = 64
dropout = 0.1                  # dropout percentage
norm_layer = "Batch"           # batch or layer norm
categorical_mode = "gumbel"    # reinmax or gumbel

[ltuner.train_kwargs]
temp = 10
hard = false

[ltuner.validate_kwargs]
temp = 0.001
hard = true

# Optimizer choice for training, refer to pytorch docs for options
[optimizer]
name = "Adam"
options = {"lr" = 0.001}

# scheduler choice for training, refer to pytorch docs for options
[scheduler]
name = "CosineAnnealingLR"
options = {"T_max" = 10, "eta_min" = 0.0001}

# loss choice for training, the name can be a path to a neural network
[loss]
name = "MSE"
options = {"reduction" = "mean"}
